name: Build and Release Retrazo

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build macOS Application
    # Match the SDK used for local Retrazo builds. SwiftUI's NavigationSplitView
    # appearance is linked to the build SDK, so older runners produce the legacy
    # squared sidebar and different system background colors on macOS 26.
    runs-on: macos-26

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode Toolchain
        run: sudo xcode-select -s /Applications/Xcode_26.5.app/Contents/Developer

      - name: Print Swift & OS Info
        run: |
          swift --version
          uname -a
          xcrun --sdk macosx --show-sdk-version
          test "$(xcrun --sdk macosx --show-sdk-version)" = "26.5"

      - name: Make Scripts Executable
        run: chmod +x scripts/*.sh

      - name: Build Retrazo App
        env:
          RETRAZO_BUILD_NUMBER: ${{ github.run_number }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            export RETRAZO_VERSION="${GITHUB_REF_NAME#v}"
          fi
          ./scripts/build_app.sh

      - name: Verify App Bundle
        run: |
          codesign --verify --deep --strict --verbose=2 build/Retrazo.app
          cmp Sources/Retrazo/Resources/AppIcon.icns build/Retrazo.app/Contents/Resources/AppIcon.icns
          test ! -f build/Retrazo.app/Contents/Resources/Assets.car
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIconFile' build/Retrazo.app/Contents/Info.plist)" = "AppIcon"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' build/Retrazo.app/Contents/Info.plist)" = "${GITHUB_REF_NAME#v}"
          fi

      - name: Package DMG Installer
        run: ./scripts/create_dmg.sh

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Retrazo-macOS
          path: |
            build/Retrazo-macOS.zip
            build/Retrazo-macOS.dmg
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/Retrazo-macOS.zip
            build/Retrazo-macOS.dmg
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
